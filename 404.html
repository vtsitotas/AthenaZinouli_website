<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Η σελίδα δεν βρέθηκε | Οδοντιατρείο Αθηνάς Ζηνούλη</title>
    <link rel="icon" type="image/jpeg" href="photos/logo_enhanced.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            color: #fff;
        }
        .box { max-width: 540px; }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            margin-bottom: 28px;
        }
        h1 { font-size: 6rem; font-weight: 700; line-height: 1; margin-bottom: 10px; }
        h2 { font-size: 1.6rem; font-weight: 600; margin-bottom: 16px; }
        p { font-size: 1.05rem; opacity: 0.92; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: #fff;
            color: #0077b6;
            padding: 14px 38px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3); }
        @media (max-width: 576px) { h1 { font-size: 4.5rem; } h2 { font-size: 1.3rem; } }
    </style>
</head>

<body>
    <div class="box">
        <img src="photos/logo_enhanced.jpg" alt="Οδοντιατρείο Αθηνάς Ζηνούλη" class="logo">
        <h1>404</h1>
        <h2>Η σελίδα δεν βρέθηκε</h2>
        <p>Λυπούμαστε, η σελίδα που αναζητάτε δεν υπάρχει ή έχει μετακινηθεί.</p>
        <a href="/" class="btn">Επιστροφή στην Αρχική</a>
    </div>
</body>

</html>
